<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Дом у моря</title>
</head>
<body>
    <h1>Список домов</h1>

    {% for house in houses %}
        <div style="border: 1px solid black; margin-bottom: 15px; padding-bottom: 10px;">
            <h2>{{ house.name }}</h2>
            <p>{{ house.price }}</p>
            <div>{{ house.description }}</div>
        </div>
    {% endfor %}
</body>
</html>
